'Peinture magasin',team:3,start:'2026-11-02',days:4,tasks:[{id:51,day:1,name:'Protection mobilier',desc:'Protéger les zones de vente.',status:'todo',comment:'',photos:[]}]},{id:6,client:6,name:'Finitions appartement',team:4,start:'2026-11-04',days:3,tasks:[{id:61,day:1,name:'Reprises enduit',desc:'Reboucher les défauts.',status:'todo',comment:'',photos:[]}] }],clocks:[]};let data;try{data=JSON.parse(localStorage.getItem('alpeDemo'))||structuredClone(defaultData)}catch{data=structuredClone(defaultData)}let page='dashboard',role='responsable',selectedJob=1,weekStart='2026-11-02',reportType='prep',photoTarget=null;const save=()=>localStorage.setItem('alpeDemo',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const client=id=>data.clients.find(x=>x.id==id)||{name:'Client inconnu',city:''};const job=id=>data.jobs.find(x=>x.id==id);const iso=d=>new Date(d+'T12:00:00');const dateAdd=(s,n)=>{let d=iso(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};const fr=s=>iso(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});const allowed=j=>role==='responsable'||j.team===+role;const jobs=()=>data.jobs.filter(allowed);function go(p){page=p;render()}function detail(id){selectedJob=id;page='detail';render()}function nav(){document.getElementById('nav').innerHTML=navs.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i} &nbsp; ${n}</button>`).join('');document.getElementById('mobilebar').innerHTML=navs.filter(x=>['dashboard','planning','jobs','clock','reports'].includes(x[0])).map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i}<br>${n}</button>`).join('')};function render(){document.getElementById('role').value=role;nav();let titles={dashboard:'Tableau de bord',planning:'Planning des équipes',teams:'Gestion des équipes',clients:'Clients & heures',jobs:'Chantiers',detail:'Détail du chantier',clock:'Badgeage des équipes',reports:'Exports PDF'};document.getElementById('title').textContent=titles[page];document.getElementById('app').innerHTML=({dashboard,planning,teams,clients,jobs:jobsView,detail:detailView,clock:clockView,reports:reportsView})[page]();}function dashboard(){let ts=jobs(),done=ts.flatMap(j=>j.tasks).filter(t=>t.status==='done').length;return `<div class="notice">Mode démo : sélectionnez un rôle en haut à droite. Les modifications sont conservées sur cet appareil. Les photos ajoutées sont réelles ; les exemples sont indicatifs.</div><div class="grid"><div class="panel"><span class="muted">Équipes</span><div class="stat">5</div><span class="pill">2 salariés par équipe</span></div><div class="panel"><span class="muted">Chantiers accessibles</span><div class="stat">${ts.length}</div><span class="pill">Semaine de démonstration</span></div><div class="panel"><span class="muted">Tâches terminées</span><div class="stat">${done}</div><span class="pill">Suivi terrain</span></div></div><div class="panel"><div class="row"><h3>Chantiers à suivre</h3><button class="btn primary" onclick="go('planning')">Voir le planning</button></div><div class="cards">${ts.map(j=>`<div class="card"><h3>${esc(client(j.client).name)}</h3><p>${esc(j.name)} · ${esc(client(j.client).city)}</p><p>Équipe ${j.team+1} · ${fr(j.start)} · ${j.days} jours</p><button class="btn" onclick="detail(${j.id})">Ouvrir le chantier →</button></div>`).join('')}</div></div>`}function planning(){let days=Array.from({length:5},(_,i)=>dateAdd(weekStart,i));return `<div class="panel"><div class="toolbar"><button class="btn" onclick="weekStart=dateAdd(weekStart,-7);render()">←</button><strong>Semaine du ${fr(weekStart)} au ${fr(days[4])}</strong><button class="btn" onclick="weekStart=dateAdd(weekStart,7);render()">→</button>${role==='responsable'?'<button class="btn primary" onclick="newJob()">+ Nouveau chantier</button>':''}</div><div class="scroll"><div class="week"><div class="cell headcell">Équipes</div>${days.map((d,i)=>`<div class="cell headcell">${['Lun','Mar','Mer','Jeu','Ven'][i]}<br>${fr(d)}</div>`).join('')}${data.teams.map((t,i)=>`<div class="cell teamcell">Équipe ${i+1}<div class="muted" style="font-size:11px;font-weight:400;margin-top:7px">${esc(t.chef)}<br>${esc(t.prep)}</div></div>${days.map(d=>`<div class="cell">${data.jobs.filter(j=>j.team===i&&d>=j.start&&d<dateAdd(j.start,j.days)).map(j=>`<div class="job" onclick="detail(${j.id})">${esc(client(j.client).name)}<small>${esc(j.name)}</small></div>`).join('')}</div>`).join('')}`).join('')}</div></div></div>`}function teams(){return `<div class="panel"><h3>Composition des équipes</h3><p class="muted">Chaque chef est affecté à son équipe. Le responsable peut changer les préparateurs et les chefs.</p><div class="cards">${data.teams.map((t,i)=>`<div class="card"><h3>Équipe ${i+1}</h3><div class="field"><label>Chef d'équipe</label><input value="${esc(t.chef)}" ${role==='responsable'?'':'disabled'} onchange="data.teams[${i}].chef=this.value;save()"></div><div class="field"><label>Préparateur</label><select ${role==='responsable'?'':'disabled'} onchange="setPrep(${i},this.value)">${[...new Set(data.teams.map(t=>t.prep))].map(n=>`<option ${n===t.prep?'selected':''}>${esc(n)}</option>`).join('')}</select></div><p class="muted">${data.jobs.filter(j=>j.team===i).length} chantier(s) programmé(s)</p></div>`).join('')}</div></div>`}function setPrep(i,n){let old=data.teams[i].prep,other=data.teams.findIndex((t,k)=>k!==i&&t.prep===n);data.teams[i].prep=n;if(other>=0)data.teams[other].prep=old;save();render()}function clients(){return `<div class="panel"><h3>Clients et historique des heures</h3><div class="scroll"><table class="table"><thead><tr><th>Client</th><th>Chantiers</th><th>Heures enregistrées</th><th></th></tr></thead><tbody>${data.clients.map(c=>{let js=data.jobs.filter(j=>j.client===c.id),mins=data.clocks.filter(x=>js.some(j=>j.id===x.jobId)).reduce((a,x)=>a+minutes(x),0);return `<tr><td><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.city)}</span></td><td>${js.map(j=>esc(j.name)).join(', ')||'—'}</td><td>${(mins/60).toFixed(2)} h</td><td><button class="btn" onclick="clientDetail(${c.id})">Détails</button></td></tr>`}).join('')}</tbody></table></div></div>`}function clientDetail(id){let c=client(id),js=data.jobs.filter(j=>j.client===id);document.getElementById('app').innerHTML=`<div class="panel"><button class="btn noprint" onclick="render()">← Clients</button><h2>${esc(c.name)} · ${esc(c.city)}</h2>${js.map(j=>`<div class="card"><h3>${esc(j.name)}</h3><p>Équipe ${j.team+1} · ${fr(j.start)} · ${j.days} jours</p><p><strong>${(data.clocks.filter(x=>x.jobId===j.id).reduce((a,x)=>a+minutes(x),0)/60).toFixed(2)} h</strong> enregistrées</p><button class="btn" onclick="detail(${j.id})">Voir le chantier</button></div>`).join('')}</div>`}function jobsView(){return `<div class="panel"><div class="row"><h3>Liste des chantiers</h3>${role==='responsable'?'<button class="btn primary" onclick="newJob()">+ Nouveau chantier</button>':''}</div><div class="cards">${jobs().map(j=>`<div class="card"><span class="pill">Équipe ${j.team+1}</span><h3 style="margin-top:10px">${esc(client(j.client).name)}</h3><p>${esc(j.name)} · ${esc(client(j.client).city)}</p><p>${fr(j.start)} · ${j.days} jour(s) · ${j.tasks.length} tâche(s)</p><button class="btn primary" onclick="detail(${j.id})">Voir les tâches et photos</button></div>`).join('')}</div></div>`}function detailView(){let j=job(selectedJob);if(!j||!allowed(j))return '<div class="panel">Chantier inaccessible</div>';return `<div class="panel"><div class="row"><button class="btn noprint" onclick="go('jobs')">← Chantiers</button><div><button class="btn noprint" onclick="reportType='prep';go('reports');document.getElementById('reportJob').value=${j.id}">PDF préparation</button> <button class="btn primary noprint" onclick="reportType='final';go('reports');document.getElementById('reportJob').value=${j.id}">Rapport final</button></div></div><h2>${esc(client(j.client).name)} · ${esc(j.name)}</h2><p class="muted">${esc(client(j.client).city)} · Équipe ${j.team+1} · ${fr(j.start)} · ${j.days} jours · Chef : ${esc(data.teams[j.team].chef)}</p>${Array.from({length:j.days},(_,i)=>`<div style="margin-top:24px"><h3>Jour ${i+1} — ${fr(dateAdd(j.start,i))}</h3>${j.tasks.filter(t=>t.day===i+1).map(t=>`<div class="task"><div class="taskbody"><strong>${esc(t.name)}</strong><p class="muted" style="margin:6px 0">${esc(t.desc)}</p><div class="photos">${t.photos.map(src=>`<img src="${src}" onclick="zoom(this.src)">`).join('')}<button class="add noprint" title="Ajouter des photos" onclick="photoTarget=${t.id};document.getElementById('photoInput').click()">＋</button></div></div><div style="min-width:220px;flex:1"><div class="field"><label>Réalisation</label><select onchange="updateTask(${j.id},${t.id},'status',this.value)"><option value="todo" ${t.status==='todo'?'selected':''}>À faire</option><option value="done" ${t.status==='done'?'selected':''}>✓ Fait</option><option value="no" ${t.status==='no'?'selected':''}>✕ Non fait</option></select></div><div class="field"><label>Commentaire / raison si non fait</label><textarea onchange="updateTask(${j.id},${t.id},'comment',this.value)">${esc(t.comment)}</textarea></div></div></div>`).join('')||'<p class="muted">Aucune tâche ce jour.</p>'}${role==='responsable'?`<button class="btn noprint" onclick="addTask(${j.id},${i+1})">+ Ajouter une tâche</button>`:''}</div>`).join('')}</div>`}function updateTask(j,t,k,v){job(j).tasks.find(x=>x.id===t)[k]=v;save()}function addTask(id,day){let name=prompt('Nom de la tâche');if(!name)return;let desc=prompt('Description / consignes','')||'';job(id).tasks.push({id:Date.now(),day,name,desc,status:'todo',comment:'',photos:[]});save();render()}function newJob(){let cid=prompt('Nom du client (existant ou nouveau)');if(!cid)return;let c=data.clients.find(c=>c.name.toLowerCase()===cid.toLowerCase());if(!c){c={id:Date.now(),name:cid,city:prompt('Ville du chantier','')||''};data.clients.push(c)}let name=prompt('Nom du chantier','Travaux de peinture');if(!name)return;let team=+(prompt('Numéro de l’équipe (1 à 5)','1')||1)-1;team=Math.max(0,Math.min(4,team));let start=prompt('Date de début (AAAA-MM-JJ)','2026-11-02')||'2026-11-02';let days=Math.max(1,Math.min(30,+(prompt('Nombre de jours','3')||3)));let id=Date.now();data.jobs.push({id,client:c.id,name,team,start,days,tasks:[]});save();detail(id)}function zoom(src){document.getElementById('zoomImg').src=src;document.getElementById('photoModal').style.display='flex'}function uploadPhotos(e){let files=[...e.target.files],j=job(selectedJob),t=j.tasks.find(t=>t.id===photoTarget);if(!t)return;Promise.all(files.map(f=>new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)}))).then(arr=>{t.photos.push(...arr);try{save()}catch{alert('Stockage local saturé : réduisez la taille ou le nombre de photos.')}render()});e.target.value=''}function minutes(x){if(!x.start||!x.end)return 0;let n=(new Date(x.date+'T'+x.end)-new Date(x.date+'T'+x.start))/60000-(+x.pause||0);return Math.max(0,n)}function clockView(){let js=jobs();return `<div class="panel"><h3>Pointage des deux salariés</h3><p class="muted">Le chef saisit les horaires pour les deux membres de son équipe. Une ligne par personne et par chantier.</p><div class="formgrid"><div class="field"><label>Chantier</label><select id="clockJob">${js.map(j=>`<option value="${j.id}">${esc(client(j.client).name)} — ${esc(j.name)} (équipe ${j.team+1})</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="clockDate" type="date" value="2026-11-02"></div><div class="field"><label>Arrivée</label><input id="clockStart" type="time" value="08:00"></div><div class="field"><label>Départ</label><input id="clockEnd" type="time" value="17:00"></div><div class="field"><label>Pause en minutes</label><input id="clockPause" type="number" min="0" value="60"></div><div class="field"><label>Salarié(s)</label><select id="clockWho"><option value="both">Les deux membres de l'équipe</option><option value="chef">Chef uniquement</option><option value="prep">Préparateur uniquement</option></select></div></div><button class="btn primary" onclick="addClock()">✓ Enregistrer les heures</button></div><div class="panel"><h3>Heures enregistrées</h3><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Chantier</th><th>Salarié</th><th>Horaires</th><th>Total</th><th></th></tr></thead><tbody>${data.clocks.filter(x=>role==='responsable'||job(x.jobId)?.team===+role).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(client(job(x.jobId)?.client).name)}</td><td>${esc(x.person)}</td><td>${x.start}–${x.end} (${x.pause} min pause)</td><td>${(minutes(x)/60).toFixed(2)} h</td><td><button class="btn danger" onclick="removeClock(${x.id})">Supprimer</button></td></tr>`).join('')}</tbody></table></div></div>`}function addClock(){let j=job(+document.getElementById('clockJob').value);if(!j)return;let who=document.getElementById('clockWho').value,t=data.teams[j.team];let people=who==='both'?[t.chef,t.prep]:[who==='chef'?t.chef:t.prep];for(let person of people)data.clocks.push({id:Date.now()+Math.random(),jobId:j.id,person,date:document.getElementById('clockDate').value,start:document.getElementById('clockStart').value,end:document.getElementById('clockEnd').value,pause:+document.getElementById('clockPause').value});save();render()}function removeClock(id){if(confirm('Supprimer ce pointage ?')){data.clocks=data.clocks.filter(x=>x.id!==id);save();render()}}function reportsView(){return `<div class="panel noprint"><h3>Générer un document PDF</h3><p class="muted">Sélectionnez le document puis utilisez « Imprimer / Enregistrer en PDF ». L'impression du navigateur permet de créer un fichier PDF.</p><div class="formgrid"><div class="field"><label>Document</label><select id="reportType" onchange="reportType=this.value;buildReport()"><option value="prep" ${reportType==='prep'?'selected':''}>Préparation de chantier</option><option value="final" ${reportType==='final'?'selected':''}>Rapport de fin de chantier</option><option value="week" ${reportType==='week'?'selected':''}>Rapport de fin de semaine</option><option value="hours" ${reportType==='hours'?'selected':''}>Feuille d'heures par équipe</option></select></div><div class="field"><label>Chantier</label><select id="reportJob" onchange="buildReport()">${jobs().map(j=>`<option value="${j.id}" ${j.id===selectedJob?'selected':''}>${esc(client(j.client).name)} — ${esc(j.name)}</option>`).join('')}</select></div><div class="field"><label>Équipe</label><select id="reportTeam" onchange="buildReport()">${data.teams.map((t,i)=>`<option value="${i}">Équipe ${i+1}</option>`).join('')}</select></div><div class="field"><label>Semaine du</label><input id="reportWeek" type="date" value="2026-11-02" onchange="buildReport()"></div></div><button class="btn primary" onclick="window.print()">▧ Imprimer / Enregistrer en PDF</button></div><div id="reportPreview" class="panel"></div>`}function buildReport(){let type=document.getElementById('reportType').value,id=+document.getElementById('reportJob').value,team=+document.getElementById('reportTeam').value,week=document.getElementById('reportWeek').value,j=job(id);let js=type==='week'?data.jobs.filter(x=>x.team===team&&x.start<=dateAdd(week,6)&&dateAdd(x.start,x.days-1)>=week):type==='hours'?data.jobs.filter(x=>x.team===team):[j];let html=`<div style="border-bottom:3px solid #008ec7;padding-bottom:12px;margin-bottom:18px"><h2 style="margin:0">ALPE · ${{prep:'Préparation de chantier',final:'Rapport de fin de chantier',week:'Rapport de fin de semaine',hours:"Feuille d'heures"}[type]}</h2><p class="muted">Document de démonstration · ${new Date().toLocaleDateString('fr-FR')}</p></div>`;if(type==='hours'){let rows=data.clocks.filter(x=>js.some(j=>j.id===x.jobId)&&job(x.jobId).team===team&&x.date>=week&&x.date<=dateAdd(week,6));html+=`<h3>Équipe ${team+1} · Semaine du ${fr(week)}</h3><table class="table"><tr><th>Date</th><th>Client / Chantier</th><th>Salarié</th><th>Horaires</th><th>Heures</th></tr>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(client(job(x.jobId).client).name)} / ${esc(job(x.jobId).name)}</td><td>${esc(x.person)}</td><td>${x.start}–${x.end}</td><td>${(minutes(x)/60).toFixed(2)}</td></tr>`).join('')}</table><h3>Total : ${(rows.reduce((a,x)=>a+minutes(x),0)/60).toFixed(2)} h</h3>`}else html+=js.map(j=>`<h3>${esc(client(j.client).name)} — ${esc(j.name)}</h3><p>Équipe ${j.team+1} · ${fr(j.start)} · ${j.days} jours · ${esc(client(j.client).city)}</p>${j.tasks.map(t=>`<div class="task"><div class="taskbody"><strong>Jour ${t.day} — ${esc(t.name)}</strong><p>${esc(t.desc)}</p>${type!=='prep'?`<p><b>État :</b> ${t.status==='done'?'Fait':t.status==='no'?'Non fait':'Non renseigné'} · <b>Commentaire :</b> ${esc(t.comment)||'—'}</p>`:''}<div class="photos">${t.photos.map(src=>`<img src="${src}">`).join('')}</div></div></div>`).join('')}`).join('');document.getElementById('reportPreview').innerHTML=html}const oldRender=render;render=function(){oldRender();if(page==='reports')buildReport()};render();</script></body></html>
